[project]
name = "finplat"
version = "0.1.0"
description = "AI Financial Crime Intelligence & Investigation Platform — backend foundation (V0.1: API + DB + AI gateway, forked from aiplat's Step 1-2 scaffold)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<5.0",
    "python-dotenv>=1.0",
    "email-validator>=2.2",
    "google-genai>=1.0",
    "openai>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's Depends(...) in argument defaults is the standard idiom.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
